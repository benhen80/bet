<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scommesse</title>
<style>
:root{
  --bg:#ffffff; --ink:#111417; --muted:#7a838c; --line:#e7eaed;
  --hl:#fff6a8; --hl-ink:#3a3400; --accent:#0f5c8a; --bad:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1114; --ink:#eceff2; --muted:#7f8993; --line:#242a30;
    --hl:#4a4510; --hl-ink:#fff7b0; --accent:#6bbbe8; --bad:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1114; --ink:#eceff2; --muted:#7f8993; --line:#242a30;
  --hl:#4a4510; --hl-ink:#fff7b0; --accent:#6bbbe8; --bad:#ff8a80;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4;font-variant-numeric:tabular-nums;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:32px 18px 64px}
h1{font-size:.85rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 22px}
button,input,select{touch-action:manipulation}
input,select{font:inherit;font-size:16px;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0;min-height:44px;width:100%;min-width:0}
input[type=number]{-moz-appearance:textfield}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left;display:block}
input:focus,select:focus{outline:none;border-bottom-color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.l,.f span{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.02em}

.params{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

details.more{margin-top:14px}
summary{cursor:pointer;font-size:.85rem;color:var(--muted);list-style:none;padding:6px 0;width:max-content}
summary::-webkit-details-marker{display:none}
summary::after{content:" +"}
details[open] summary::after{content:" −"}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:8px}
.opts .full{grid-column:1/-1}
.chk{display:flex;gap:10px;align-items:center;font-size:.92rem}
.chk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:.85rem;padding:8px 12px;min-height:40px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin:0}

.result{margin:34px 0 22px}
.big{display:flex;align-items:baseline;gap:10px}
.big b{font-size:clamp(3rem,16vw,4.6rem);font-weight:600;line-height:1;letter-spacing:-.03em}
.big span{font-size:1.1rem;color:var(--muted)}
#line{margin:10px 0 0;font-size:1.05rem}
#line2{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.err{color:var(--bad)}

.bar{height:2px;background:var(--line);margin:0}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--muted);margin:8px 0 18px}

/* elenco */
#list{border-top:1px solid var(--line)}
.bet{display:grid;grid-template-columns:28px 128px 1fr 76px 1fr 30px;grid-template-areas:"n date stake mult win won";gap:12px;align-items:end;padding:8px 6px;border-bottom:1px solid var(--line)}
.top{display:contents}
.n{grid-area:n;color:var(--muted);font-size:.85rem;align-self:center}
.date{grid-area:date}
.stake{grid-area:stake}.mult{grid-area:mult}.win{grid-area:win}
.wonl{grid-area:won;display:flex;align-items:center;justify-content:center;margin:0;cursor:pointer;align-self:center}
.wonl input{width:24px;height:24px;min-height:0;accent-color:var(--accent)}
.f b{display:block;font-weight:500;padding:8px 0;min-height:44px;line-height:28px}
.f input.ovr{border-bottom-color:var(--accent)}
.bet.won{background:var(--hl);color:var(--hl-ink)}
.bet.won .f span,.bet.won .n{color:inherit;opacity:.7}
.bet.won input{border-bottom-color:transparent}
.bet.now{box-shadow:inset 3px 0 0 var(--accent)}

@media (max-width:600px){
  .wrap{padding:22px 16px 56px}
  .params{gap:14px}
  .bet{grid-template-columns:1fr 84px 1fr;grid-template-areas:"top top top" "stake mult win";gap:0 14px;padding:10px 4px 8px}
  .top{display:flex;grid-area:top;align-items:center;gap:12px}
  .top .date{flex:1}
  .n{min-width:22px}
  .wonl{margin-left:auto}
  .wonl input{width:28px;height:28px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Scommesse</h1>

  <section class="params" aria-label="Parametri">
    <div><label class="l" for="stake">Puntata (€)</label><input id="stake" type="number" inputmode="decimal" min="0.01" step="any" value="10"></div>
    <div><label class="l" for="mult">Moltiplicatore</label><input id="mult" type="number" inputmode="decimal" min="1.001" step="any" value="1.1"></div>
    <div><label class="l" for="target">Target (€)</label><input id="target" type="number" inputmode="decimal" min="0.01" step="any" value="100"></div>
  </section>

  <details class="more">
    <summary>Opzioni</summary>
    <div class="opts">
      <div><label class="l" for="ttype">Il target è</label>
        <select id="ttype"><option value="final">Importo finale</option><option value="profit">Guadagno netto</option></select></div>
      <div><label class="l" for="start">Prima scommessa</label><input id="start" type="date"></div>
      <label class="chk full"><input id="round" type="checkbox"> Arrotonda gli importi all'euro</label>
      <div class="btns full">
        <button id="resetStakes" type="button">Ripristina puntate e moltipl.</button>
        <button id="resetDates" type="button">Una scommessa al giorno</button>
        <button id="resetWins" type="button">Azzera vinte</button>
      </div>
      <p class="note full">Puntata, moltiplicatore e data di ogni riga si possono cambiare: le righe successive si aggiornano. Una riga modificata ha la sottolineatura colorata; svuota il campo per tornare al valore automatico. Stessa data della riga sopra = più scommesse nello stesso giorno.</p>
    </div>
  </details>

  <section class="result" aria-live="polite">
    <div class="big"><b id="bigN">–</b><span id="bigL">scommesse</span></div>
    <p id="line"></p>
    <p id="line2"></p>
  </section>

  <div class="bar"><i id="barFill"></i></div>
  <div class="meta"><span id="pText"></span><span id="pNext"></span></div>

  <div id="list"></div>
</div>

<script>
(function(){
  var KEY="scommesse-dashboard-v3";
  var MAX=500;
  var $=function(id){return document.getElementById(id)};
  var eur=new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
  var dfmt=new Intl.DateTimeFormat("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});
  function pad(x){return x<10?"0"+x:""+x}
  function isoOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function parseD(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
  function addDays(iso,n){var d=parseD(iso);d.setDate(d.getDate()+n);return d}
  function todayISO(){return isoOf(new Date())}
  function num(v){var x=parseFloat(String(v).replace(",","."));return isNaN(x)?null:x}
  function fmtIn(x){return String(+x.toFixed(2))}

  var state={stake:10,mult:1.1,target:100,ttype:"final",round:false,start:todayISO(),ov:{},mov:{},gaps:{},won:{}};
  var curDates=[];

  function load(){
    try{
      var s=JSON.parse(localStorage.getItem(KEY)||"null");
      if(s&&typeof s==="object"){for(var k in state){if(s[k]!==undefined)state[k]=s[k]}}
    }catch(e){}
    $("stake").value=state.stake;$("mult").value=state.mult;$("target").value=state.target;
    $("ttype").value=state.ttype;$("round").checked=!!state.round;$("start").value=state.start;
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

  function compute(){
    var stake=state.stake,mult=state.mult,target=state.target;
    if(!(stake>0)||!(mult>1)||!(target>0))return null;
    var goalNet=state.ttype==="profit"?target:target-stake;
    var rows=[],prevR=stake,cum=0,reached=false;
    for(var i=0;i<MAX;i++){
      var p,ovr=false;
      if(i===0)p=stake;
      else if(state.ov[i]>0){p=state.ov[i];ovr=true}
      else p=prevR;
      var mvr=state.mov[i]>1,m=mvr?state.mov[i]:mult;
      var r=p*m;
      if(state.round){r=Math.round(r);if(r<=p)r=p+1}
      cum+=r-p;
      rows.push({p:p,r:r,cum:cum,ovr:ovr,m:m,mvr:mvr});
      prevR=r;
      if(cum>=goalNet-1e-9){reached=true;break}
    }
    return {rows:rows,reached:reached};
  }

  function makeRow(i){
    var d=document.createElement("div");
    d.className="bet";d.dataset.i=i;
    d.innerHTML=
      '<div class="top">'+
        '<span class="n"></span>'+
        '<input type="date" class="date" data-k="date" aria-label="Data scommessa '+(i+1)+'">'+
        '<label class="wonl"><input type="checkbox" data-k="won" aria-label="Scommessa '+(i+1)+' vinta"></label>'+
      '</div>'+
      '<div class="f stake"><span>Puntata</span><input type="number" inputmode="decimal" step="any" min="0" data-k="s" aria-label="Puntata scommessa '+(i+1)+'"></div>'+
      '<div class="f mult"><span>Moltipl.</span><input type="number" inputmode="decimal" step="any" min="1" data-k="m" aria-label="Moltiplicatore scommessa '+(i+1)+'"></div>'+
      '<div class="f win"><span data-o="wl">Ritorno</span><b data-o="r"></b></div>';
    return d;
  }

  function update(force){
    var list=$("list"),i;
    var res=compute();
    if(!res){
      $("bigN").textContent="–";$("bigL").textContent="scommesse";
      $("line").innerHTML='<span class="err">Puntata e target maggiori di 0, moltiplicatore maggiore di 1.</span>';
      $("line2").textContent="";list.innerHTML="";
      $("barFill").style.width="0";$("pText").textContent="";$("pNext").textContent="";
      return;
    }
    var rows=res.rows,n=rows.length,last=rows[n-1];

    var dates=[];
    for(i=0;i<n;i++){dates.push(i===0?state.start:isoOf(addDays(dates[i-1],state.gaps[i]!=null?state.gaps[i]:1)))}
    curDates=dates;

    var endAmount=state.stake+last.cum;
    if(res.reached){
      $("bigN").textContent=n;
      $("bigL").textContent=n===1?"scommessa":"scommesse";
      $("line").textContent=eur.format(state.stake)+" → "+eur.format(endAmount);
      $("line2").textContent="Ultima puntata "+eur.format(last.p)+" · guadagno "+eur.format(last.cum)+" · fine "+dfmt.format(parseD(dates[n-1]));
    }else{
      $("bigN").textContent="–";
      $("bigL").textContent="target non raggiungibile";
      $("line").textContent="Aumenta il moltiplicatore o abbassa il target.";
      $("line2").textContent="";
    }

    var firstOpen=-1,wonCount=0;
    for(i=0;i<n;i++){if(!state.won[i]){firstOpen=i;break}}
    for(i=0;i<n;i++){if(state.won[i])wonCount++}
    $("barFill").style.width=(100*wonCount/n)+"%";
    $("pText").textContent=wonCount+" vinte su "+n;
    $("pNext").textContent=firstOpen>=0?"Prossima puntata "+eur.format(rows[firstOpen].p):(res.reached?"Target raggiunto":"");

    while(list.children.length<n)list.appendChild(makeRow(list.children.length));
    while(list.children.length>n)list.removeChild(list.lastChild);

    for(i=0;i<n;i++){
      var el=list.children[i],row=rows[i];
      el.className="bet"+(state.won[i]?" won":"")+(i===firstOpen?" now":"");
      el.querySelector(".n").textContent=i+1;
      var di=el.querySelector('[data-k="date"]');
      di.value=dates[i];
      if(i>0)di.min=dates[i-1];else di.removeAttribute("min");
      el.querySelector('[data-k="won"]').checked=!!state.won[i];
      var si=el.querySelector('[data-k="s"]');
      if(force||document.activeElement!==si)si.value=fmtIn(row.p);
      si.classList.toggle("ovr",row.ovr);
      var mi=el.querySelector('[data-k="m"]');
      if(force||document.activeElement!==mi)mi.value=String(+row.m.toFixed(3));
      mi.classList.toggle("ovr",row.mvr);
      el.querySelector('[data-o="wl"]').textContent=(res.reached&&i===n-1)?"Ritorno · target":"Ritorno";
      el.querySelector('[data-o="r"]').textContent=eur.format(row.r);
    }
  }

  function bind(id,fn,ev){$(id).addEventListener(ev||"input",function(){fn.call(this);save();update(false)})}
  bind("stake",function(){state.stake=num(this.value)||0});
  bind("mult",function(){state.mult=num(this.value)||0});
  bind("target",function(){state.target=num(this.value)||0});
  bind("ttype",function(){state.ttype=this.value},"change");
  bind("round",function(){state.round=this.checked},"change");
  bind("start",function(){state.start=this.value||todayISO()},"change");

  var list=$("list");
  list.addEventListener("input",function(e){
    var t=e.target;
    var k=t.dataset&&t.dataset.k;
    if(k!=="s"&&k!=="m")return;
    var i=+t.closest(".bet").dataset.i,v=num(t.value);
    if(k==="m"){if(v>1)state.mov[i]=v;else delete state.mov[i];save();update(false);return}
    if(i===0){
      if(!(v>0))return;
      state.stake=v;$("stake").value=v;
    }else{
      if(v>0)state.ov[i]=v;else delete state.ov[i];
    }
    save();update(false);
  });
  list.addEventListener("change",function(e){
    var t=e.target,k=t.dataset&&t.dataset.k;
    if(!k)return;
    var i=+t.closest(".bet").dataset.i;
    if(k==="s"||k==="m"){update(true);return}
    if(k==="won"){
      if(t.checked)state.won[i]=true;else delete state.won[i];
      save();update(false);return;
    }
    if(k==="date"){
      var v=t.value;
      if(!v){update(true);return}
      if(i===0){state.start=v;$("start").value=v}
      else{
        var g=Math.round((parseD(v)-parseD(curDates[i-1]))/86400000);
        state.gaps[i]=g<0?0:g;
      }
      save();update(false);
    }
  });
  $("resetStakes").addEventListener("click",function(){state.ov={};state.mov={};save();update(true)});
  $("resetDates").addEventListener("click",function(){state.gaps={};save();update(false)});
  $("resetWins").addEventListener("click",function(){state.won={};save();update(false)});

  load();update(true);
})();
</script>
</body>
</html>
