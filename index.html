<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Budget → Target</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; font-weight: 600; }
  .card {
    background: #1e293b;
    border-radius: 14px;
    padding: 20px;
    max-width: 760px;
    margin: 0 auto 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: #38bdf8; }
  .result {
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    margin-top: 8px;
  }
  .result .big {
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
  }
  .result .sub {
    font-size: 13px;
    opacity: .9;
    margin-top: 6px;
  }
  .detail {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 14px;
    font-size: 13px;
  }
  .detail div {
    background: #0f172a;
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
  }
  .detail span:first-child { color: #94a3b8; }
  .warn { color: #f87171; font-size: 13px; margin-top: 10px; text-align:center; }

  /* --- STORICO --- */
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    padding: 4px 0;
  }
  .history-header h2 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chev {
    transition: transform .2s;
    display: inline-block;
    font-size: 12px;
    color: #94a3b8;
  }
  .collapsed .chev { transform: rotate(-90deg); }
  .history-body {
    margin-top: 16px;
    overflow: hidden;
    transition: max-height .3s ease, opacity .2s;
    max-height: 2000px;
    opacity: 1;
  }
  .collapsed .history-body {
    max-height: 0;
    opacity: 0;
    margin-top: 0;
  }
  .history-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .history-summary div {
    background: #0f172a;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .history-summary span { color: #94a3b8; display: block; font-size: 11px; margin-bottom: 2px; }
  .history-summary strong { font-size: 14px; }
  .add-form {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 14px;
  }
  .add-form input, .add-form select { padding: 8px 10px; font-size: 13px; }
  button {
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #7dd3fc; }
  button.ghost {
    background: transparent;
    color: #94a3b8;
    border: 1px solid #334155;
    padding: 6px 10px;
    font-size: 12px;
  }
  button.ghost:hover { color: #f87171; border-color: #f87171; background: transparent; }
  button.del {
    background: transparent;
    color: #f87171;
    padding: 4px 8px;
    font-size: 14px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid #334155;
  }
  th { color: #94a3b8; font-weight: 500; font-size: 11px; text-transform: uppercase; }
  .win { color: #4ade80; font-weight: 600; }
  .lose { color: #f87171; font-weight: 600; }
  .empty { color: #64748b; text-align: center; padding: 16px; font-size: 13px; }

  @media (max-width: 520px) {
    .grid, .detail, .history-summary { grid-template-columns: 1fr 1fr; }
    .add-form { grid-template-columns: 1fr 1fr; }
    .add-form button { grid-column: span 2; }
    .result .big { font-size: 32px; }
  }
</style>
</head>
<body>

<!-- ============ PIANO ============ -->
<div class="card">
  <h1>🎯 Budget → Target</h1>

  <div class="grid">
    <div>
      <label>Budget iniziale (€)</label>
      <input type="number" id="budget" value="100" min="0" step="10">
    </div>
    <div>
      <label>Vincita target (€)</label>
      <input type="number" id="target" value="10000" min="0" step="100">
    </div>
    <div>
      <label>Moltiplicatore</label>
      <input type="number" id="mult" value="2" min="1.01" step="0.1">
    </div>
    <div>
      <label>Data inizio</label>
      <input type="date" id="start">
    </div>
  </div>

  <div class="result">
    <div class="big" id="days">—</div>
    <div class="sub" id="daysLabel">giorni necessari</div>
  </div>

  <div class="detail">
    <div><span>Data raggiungimento</span><strong id="endDate">—</strong></div>
    <div><span>Capitale finale</span><strong id="finalCap">—</strong></div>
    <div><span>Raddoppi richiesti</span><strong id="doublings">—</strong></div>
    <div><span>Puntate totali</span><strong id="bets">—</strong></div>
  </div>

  <div class="warn" id="warn"></div>
</div>

<!-- ============ STORICO ============ -->
<div class="card" id="historyCard">
  <div class="history-header" onclick="toggleHistory()">
    <h2>📒 Storico puntate <span class="chev">▼</span></h2>
    <button class="ghost" onclick="event.stopPropagation(); resetHistory()">Reset</button>
  </div>

  <div class="history-body">
    <div class="history-summary">
      <div><span>Puntate</span><strong id="sBets">0</strong></div>
      <div><span>Vinte / Perse</span><strong id="sWL">0 / 0</strong></div>
      <div><span>Capitale attuale</span><strong id="sCap">—</strong></div>
      <div><span>Giorni al target</span><strong id="sLeft">—</strong></div>
    </div>

    <div class="add-form">
      <input type="date" id="hDate">
      <input type="number" id="hAmount" placeholder="Importo €" step="1" min="0">
      <select id="hResult">
        <option value="win">Vinta ✓</option>
        <option value="lose">Persa ✗</option>
      </select>
      <button onclick="addBet()">Aggiungi</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Importo</th>
          <th>Esito</th>
          <th>Variazione</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="betRows">
        <tr><td colspan="5" class="empty">Nessuna puntata registrata</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'betHistory_v1';

// ---------- UTIL ----------
const fmtEur = n => n.toLocaleString('it-IT', { style:'currency', currency:'EUR', maximumFractionDigits: 2 });
const parseNum = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

function getPlan() {
  return {
    B: parseNum($('budget').value),
    T: parseNum($('target').value),
    M: parseNum($('mult').value) || 2,
    start: new Date($('start').value || new Date())
  };
}

// ---------- STORICO ----------
let history = JSON.parse(localStorage.getItem(KEY) || '[]');

function saveHistory() {
  localStorage.setItem(KEY, JSON.stringify(history));
}

function toggleHistory() {
  $('historyCard').classList.toggle('collapsed');
}

function addBet() {
  const date = $('hDate').value;
  const amount = parseNum($('hAmount').value);
  const result = $('hResult').value;
  if (!date || amount <= 0) return;

  history.push({ id: Date.now() + Math.random(), date, amount, result });
  history.sort((a,b) => a.date.localeCompare(b.date));
  saveHistory();

  $('hAmount').value = '';
  renderHistory();
  calc();
}

function removeBet(id) {
  history = history.filter(b => b.id !== id);
  saveHistory();
  renderHistory();
  calc();
}

function resetHistory() {
  if (!confirm('Svuotare tutto lo storico puntate?')) return;
  history = [];
  saveHistory();
  renderHistory();
  calc();
}

function renderHistory() {
  const tbody = $('betRows');
  const { M } = getPlan();

  if (history.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Nessuna puntata registrata</td></tr>';
  } else {
    tbody.innerHTML = history.map(b => {
      const delta = b.result === 'win' ? b.amount * (M - 1) : -b.amount;
      return `<tr>
        <td>${new Date(b.date).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})}</td>
        <td>${fmtEur(b.amount)}</td>
        <td class="${b.result === 'win' ? 'win' : 'lose'}">${b.result === 'win' ? 'Vinta' : 'Persa'}</td>
        <td class="${delta >= 0 ? 'win' : 'lose'}">${delta >= 0 ? '+' : ''}${fmtEur(delta)}</td>
        <td><button class="del" onclick="removeBet(${b.id})">✕</button></td>
      </tr>`;
    }).join('');
  }

  // riepilogo
  const wins = history.filter(b => b.result === 'win').length;
  const losses = history.length - wins;
  const { B, T, M: mult } = getPlan();

  // capitale attuale = budget + somma variazioni
  let capital = B;
  history.forEach(b => {
    capital += b.result === 'win' ? b.amount * (mult - 1) : -b.amount;
  });
  if (capital < 0) capital = 0;

  $('sBets').textContent = history.length;
  $('sWL').textContent = `${wins} / ${losses}`;
  $('sCap').textContent = fmtEur(capital);

  // giorni residui al target dal capitale attuale
  if (capital >= T) {
    $('sLeft').textContent = '0 (raggiunto)';
  } else if (capital > 0 && mult > 1) {
    const n = Math.ceil(Math.log(T / capital) / Math.log(mult));
    $('sLeft').textContent = n;
  } else {
    $('sLeft').textContent = '—';
  }
}

// ---------- CALCOLO PIANO ----------
function calc() {
  const { B, T, M, start } = getPlan();

  $('warn').textContent = '';
  if (B <= 0 || T <= 0 || M <= 1 || isNaN(start.getTime())) {
    ['days','endDate','finalCap','doublings','bets'].forEach(id => $(id).textContent = '—');
    return;
  }

  if (T <= B) {
    $('days').textContent = '0';
    $('daysLabel').textContent = 'sei già al target';
    $('endDate').textContent = start.toLocaleDateString('it-IT');
    $('finalCap').textContent = fmtEur(B);
    $('doublings').textContent = '0';
    $('bets').textContent = '0';
    return;
  }

  const nDays = Math.ceil(Math.log(T / B) / Math.log(M));
  const finalCap = B * Math.pow(M, nDays);

  const end = new Date(start);
  end.setDate(end.getDate() + nDays);
  const endStr = end.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit', year:'numeric' });

  $('days').textContent = nDays;
  $('daysLabel').textContent = nDays === 1 ? 'giorno necessario' : 'giorni necessari';
  $('endDate').textContent = endStr;
  $('finalCap').textContent = fmtEur(finalCap);
  $('doublings').textContent = nDays;
  $('bets').textContent = nDays;

  if (nDays > 60) {
    $('warn').textContent = `⚠️ Con moltiplicatore ${M} servono molti giorni: valuta un target più basso o un moltiplicatore più alto.`;
  }
}

// ---------- INIT ----------
$('start').value = new Date().toISOString().slice(0,10);
$('hDate').value  = $('start').value;

['budget','target','mult','start'].forEach(id =>
  $(id).addEventListener('input', () => { calc(); renderHistory(); })
);

renderHistory();
calc();
</script>
</body>
</html>
